title: BatteryIncluded Integrations
description: BatteryIncluded – AI search, merchandising and recommendations for e-commerce – and every way to integrate it into your shop.
url: https://batteryincluded.eiling.io
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: eiling
# logo of the sidebar (variant of logo.svg for the dark background), without logo the title is shown as text
logo: /assets/images/logo-dark.svg
favicon_ico: /assets/images/favicon.png
search_enabled: true
heading_anchors: true

aux_links:
  batteryincluded.ai: https://batteryincluded.ai
  PHP SDK: https://sdk.batteryincluded.eiling.io
  Symfony Bundle: https://bundle.batteryincluded.eiling.io
  Sylius Plugin: https://sylius.batteryincluded.eiling.io
  eiling.io: https://eiling.io

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/eiling-io/batteryincluded
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

defaults:
  - scope:
      path: ""
    values:
      layout: default

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
